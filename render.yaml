# render.yaml — Despliegue de la API de ML (FastAPI + XGBoost) en Render
# ======================================================================
# La API pesada NO va en Vercel; va aquí, en un servicio "always-on".
# Render construye desde el Dockerfile existente (api/Dockerfile).
#
# Pasos:
#   1. Sube el repo a GitHub.
#   2. En Render: New → Blueprint → selecciona este repo (detecta render.yaml).
#   3. Rellena las variables marcadas 'sync: false' en el dashboard.
#   4. Copia la URL pública y ponla en Vercel (y en tu .env.local) como:
#        NEXT_PUBLIC_ML_API_URL  → la usan las pestañas de recharts (app/*.tsx)
#        ML_API_URL              → la usa el proxy del Trading Lab
#
# URL en producción: https://sotck-ml.onrender.com
# El nombre del servicio decide el subdominio, así que 'name' debe coincidir
# con el servicio ya desplegado. Antes decía 'stock-ml-api', que apuntaba a un
# host que responde 503.

services:
  - type: web
    name: sotck-ml
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .            # contexto = raíz del repo (copia api/ + training/)
    plan: free                  # el free tier duerme tras 15 min de inactividad
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: POLYGON_API_KEY
        sync: false             # se pega en el dashboard (secreto)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://tu-app.vercel.app,http://localhost:3000
      - key: POLYGON_MAX_CALLS_PER_MIN
        value: "5"              # plan gratuito Polygon
      - key: TTL_INTRADAY
        value: "900"
      - key: TTL_DAILY
        value: "3600"
