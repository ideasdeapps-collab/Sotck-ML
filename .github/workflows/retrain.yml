name: Retrain models (XGBoost + MLP + Psychology)

on:
  schedule:
    - cron: "0 11 * * 1-5"       # lunes a viernes 11:00 UTC (~05:00 Morelia)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separados por espacio (vacío = lista completa)"
        default: ""

env:
  # Plan gratuito Polygon = 2 años de histórico.
  DEFAULT_TICKERS: "SNDK SMH AMAT TSM QQQ NVDA MU XLI AVGO SPCX KOID BOTZ IGV ASML META SKHY SOXX IDGT"
  YEARS: "2"

# Permite que el GITHUB_TOKEN haga push de los artefactos al repo.
# (Además: Settings → Actions → General → Workflow permissions → Read and write.)
permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Check POLYGON_API_KEY
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "::error::POLYGON_API_KEY no está configurado en Settings → Secrets → Actions."
            exit 1
          fi
          echo "POLYGON_API_KEY presente (len=${#POLYGON_API_KEY})."

      # ------------------------------------------------------------------- #
      # Fase 1 — Refresca la caché de precios en Supabase ANTES de entrenar.
      # Así los usuarios leen precios frescos desde Supabase (sin llamar a
      # Polygon) y el entrenamiento reutiliza esa misma caché.
      # Requiere SUPABASE_URL y SUPABASE_SERVICE_KEY como Secrets del repo.
      # ------------------------------------------------------------------- #
      - name: Refresh price cache (Supabase)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python training/refresh_prices.py

      - name: Train (XGBoost + MLP + Psychology) + backtest — rate-limit friendly
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TICKERS="${{ github.event.inputs.tickers }}"
          if [ -z "$TICKERS" ]; then TICKERS="$DEFAULT_TICKERS"; fi
          mkdir -p api/artifacts
          FAILED=""
          for T in $TICKERS; do
            echo "::group::Entrenando $T"
            OK=0
            for ATTEMPT in 1 2; do
              if python training/train_xgb.py --ticker "$T" --years "$YEARS"; then OK=1; break; fi
              echo "::warning::train_xgb intento $ATTEMPT falló para $T; esperando 20s..."
              sleep 20
            done
            if [ "$OK" -eq 1 ]; then
              # Red neuronal (MLP) — reutiliza el diario cacheado, no gasta llamada extra
              python training/train_mlp.py --ticker "$T" --years "$YEARS" \
                || echo "::warning::train_mlp falló para $T"
              # Modelo psicológico (IPM Opción B) — también reutiliza el diario cacheado
              python training/train_psych.py --ticker "$T" --years "$YEARS" --horizon 21 \
                || echo "::warning::train_psych falló para $T"
              sleep 13
              python training/backtest.py --ticker "$T" --years "$YEARS" --test-days 120 \
                || echo "::warning::backtest falló para $T"
            else
              echo "::warning::train_xgb falló definitivamente para $T"
              FAILED="$FAILED $T"
            fi
            echo "::endgroup::"
            sleep 15   # espaciado global: <5 llamadas/min en plan gratuito
          done
          echo "Tickers con fallo:$FAILED"

      - name: Verify artifacts exist
        run: |
          COUNT=$(ls api/artifacts/*.joblib 2>/dev/null | wc -l)
          echo "Artefactos generados (.joblib): $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No se generó ningún modelo. Revisa el log de 'Train'."
            exit 1
          fi

      - name: Commit artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find api/artifacts -type f \( -name '*.joblib' -o -name '*.json' \) -print0 | xargs -0 git add
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "chore: retrain XGBoost + MLP + Psychology + backtest [skip ci]"
            git push
          fi

  # ------------------------------------------------------------------------- #
  # Backfill automático de precios reales en los snapshots guardados (Supabase)
  # Corre DESPUÉS del retrain. Rellena actual_close para validar predicho-vs-real.
  # Requiere la variable de repo ML_API_URL (Settings → Secrets and variables →
  # Actions → Variables → New variable: ML_API_URL = https://tu-api.onrender.com).
  # ------------------------------------------------------------------------- #
  backfill-actuals:
    needs: retrain
    runs-on: ubuntu-latest
    if: ${{ vars.ML_API_URL != '' }}
    steps:
      - name: Backfill actual_close en Supabase (vía API en Render)
        env:
          ML_API_URL: ${{ vars.ML_API_URL }}
        run: |
          TICKERS="${{ github.event.inputs.tickers }}"
          if [ -z "$TICKERS" ]; then TICKERS="$DEFAULT_TICKERS"; fi
          echo "Rellenando precios reales en snapshots para: $TICKERS"
          for T in $TICKERS; do
            curl -s -X POST "${ML_API_URL}/backfill-actuals?ticker=$T&days=120" \
              -o /dev/null -w "  backfill $T: %{http_code}\n" || true
            sleep 15   # espaciado: respeta el límite de 5 llamadas/min (plan gratuito)
          done
