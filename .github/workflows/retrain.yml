name: Retrain XGBoost models

# Reentrena los modelos, corre backtest y guarda forecasts en Supabase.
on:
  schedule:
    - cron: "0 11 * * 1-5"       # lunes a viernes 11:00 UTC (~05:00 Morelia)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separados por espacio (vacío = lista completa)"
        default: ""

env:
  # Plan gratuito Polygon = 2 años de histórico -> usa 2, no 5.
  DEFAULT_TICKERS: "SNDK SMH AMAT TSM QQQ NVDA MU XLI AVGO SPCX KOID BOTZ IGV ASML META SKHY SOXX IDGT"
  YEARS: "2"

# Permite que el GITHUB_TOKEN haga push de los artefactos al repo.
# (Además: Settings → Actions → General → Workflow permissions → Read and write.)
permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Asegura que las credenciales se conserven para el push.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      # 1) Falla temprano y claro si el secret no está configurado.
      - name: Check POLYGON_API_KEY
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "::error::POLYGON_API_KEY no está configurado en Settings → Secrets → Actions."
            exit 1
          fi
          echo "POLYGON_API_KEY presente (len=${#POLYGON_API_KEY})."

      # 2) Entrena. NO ocultamos el error: si un ticker falla, lo registramos
      #    pero seguimos; al final validamos que exista al menos 1 modelo.
      - name: Train + backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          TICKERS="${{ github.event.inputs.tickers }}"
          if [ -z "$TICKERS" ]; then TICKERS="$DEFAULT_TICKERS"; fi
          mkdir -p api/artifacts
          FAILED=""
          for T in $TICKERS; do
            echo "::group::Entrenando $T"
            if python training/train_xgb.py --ticker "$T" --years "$YEARS"; then
              python training/backtest.py --ticker "$T" --years "$YEARS" --test-days 120 \
                || echo "::warning::backtest falló para $T"
            else
              echo "::warning::train falló para $T"
              FAILED="$FAILED $T"
            fi
            echo "::endgroup::"
          done
          echo "Tickers con fallo:$FAILED"

      # 3) Verifica que haya artefactos ANTES de commitear (evita el error 128).
      - name: Verify artifacts exist
        run: |
          COUNT=$(ls api/artifacts/*.joblib 2>/dev/null | wc -l)
          echo "Modelos generados: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No se generó ningún modelo. Revisa el log de 'Train + backtest' (API key, rate-limit o datos)."
            exit 1
          fi

      # 4) Commit resiliente: solo agrega lo que exista, y no falla si no hay cambios.
      - name: Commit artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Usa find en vez de glob para no romper si algún patrón no matchea.
          find api/artifacts -type f \( -name '*.joblib' -o -name '*.json' \) -print0 \
            | xargs -0 git add
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "chore: retrain + backtest [skip ci]"
            git push
          fi
